name: Require Copilot Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]
  pull_request_review_thread:
    types: [resolved, unresolved]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to check'
        required: true
        type: number

permissions:
  pull-requests: read

jobs:
  copilot-review-gate:
    name: Copilot Review Gate
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    steps:
      - name: Check for Copilot review and unresolved threads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          REPO="${{ github.repository }}"
          OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"

          # Determine PR number from event context
          if [ -n "${{ github.event.inputs.pr_number }}" ]; then
            PR_NUMBER="${{ github.event.inputs.pr_number }}"
          elif [ -n "${{ github.event.pull_request.number }}" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
          elif [ -n "${{ github.event.review.pull_request.number }}" ]; then
            PR_NUMBER="${{ github.event.review.pull_request.number }}"
          elif [ -n "${{ github.event.pull_request_review_thread.pull_request.number }}" ]; then
            PR_NUMBER="${{ github.event.pull_request_review_thread.pull_request.number }}"
          else
            echo "::error::Could not determine PR number from event"
            exit 1
          fi

          echo "Checking Copilot review on PR #$PR_NUMBER"

          # Check if Copilot has reviewed (COMMENTED or APPROVED, not DISMISSED)
          if ! REVIEWS=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" 2>/dev/null); then
            echo "::error::Failed to fetch reviews for PR #$PR_NUMBER"
            exit 1
          fi

          COPILOT_REVIEW=$(echo "$REVIEWS" | jq -r '
            [.[] | select(
              .user.login == "copilot-pull-request-reviewer[bot]" and
              (.state == "COMMENTED" or .state == "APPROVED")
            )] | first | .state // empty
          ')

          if [ -z "$COPILOT_REVIEW" ]; then
            echo "::error::Copilot has not reviewed yet. Waiting for review (2-5 min). Workflow re-runs automatically when Copilot submits."
            exit 1
          fi

          echo "Copilot has reviewed (state: $COPILOT_REVIEW)"

          # Use GraphQL to count unresolved, non-outdated Copilot review threads
          # Paginates through all threads to handle PRs with >100 threads
          UNRESOLVED=0
          HAS_NEXT=true
          CURSOR=""

          QUERY='
          query($owner: String!, $repo: String!, $pr: Int!, $after: String) {
            repository(owner: $owner, name: $repo) {
              pullRequest(number: $pr) {
                reviewThreads(first: 100, after: $after) {
                  pageInfo {
                    hasNextPage
                    endCursor
                  }
                  nodes {
                    isResolved
                    isOutdated
                    comments(first: 1) {
                      nodes {
                        author {
                          login
                        }
                      }
                    }
                  }
                }
              }
            }
          }'

          while [ "$HAS_NEXT" = "true" ]; do
            # Build gh api args — omit -F after on first page (null = no cursor)
            GH_ARGS=(-f query="$QUERY" -F owner="$OWNER" -F repo="$REPO_NAME" -F pr="$PR_NUMBER")
            if [ -n "$CURSOR" ]; then
              GH_ARGS+=(-f after="$CURSOR")
            fi

            if ! RESULT=$(gh api graphql "${GH_ARGS[@]}" 2>/dev/null); then
              echo "::error::GraphQL query failed for PR #$PR_NUMBER"
              exit 1
            fi

            # Fail closed: check for GraphQL-level errors (gh can exit 0 with errors array)
            GQL_ERROR_COUNT=$(echo "$RESULT" | jq '[.errors // [] | length] | .[0]')
            if [ "$GQL_ERROR_COUNT" -gt 0 ] 2>/dev/null; then
              echo "::error::GraphQL returned errors: $(echo "$RESULT" | jq -c '.errors')"
              exit 1
            fi

            # Validate response structure
            THREADS_DATA=$(echo "$RESULT" | jq -e '.data.repository.pullRequest.reviewThreads') || {
              echo "::error::Unexpected GraphQL response structure"
              exit 1
            }

            # Count unresolved, non-outdated Copilot threads in this page
            PAGE_UNRESOLVED=$(echo "$THREADS_DATA" | jq '
              [.nodes[] |
                select(
                  .isResolved == false and
                  .isOutdated == false and
                  (.comments.nodes[0].author.login == "copilot-pull-request-reviewer[bot]")
                )
              ] | length
            ')

            # Validate count is a number
            if ! [ "$PAGE_UNRESOLVED" -eq "$PAGE_UNRESOLVED" ] 2>/dev/null; then
              echo "::error::Failed to parse thread count: $PAGE_UNRESOLVED"
              exit 1
            fi

            UNRESOLVED=$((UNRESOLVED + PAGE_UNRESOLVED))

            HAS_NEXT=$(echo "$THREADS_DATA" | jq -r '.pageInfo.hasNextPage')
            CURSOR=$(echo "$THREADS_DATA" | jq -r '.pageInfo.endCursor // empty')
          done

          echo "Unresolved Copilot threads (non-outdated): $UNRESOLVED"

          if [ "$UNRESOLVED" -gt 0 ]; then
            echo "::error::$UNRESOLVED unresolved Copilot review thread(s). Fix the code or resolve threads before merging."
            exit 1
          fi

          echo "All Copilot review threads resolved. Gate passed."
