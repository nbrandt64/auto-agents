name: Require Copilot Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]

permissions:
  pull-requests: read

jobs:
  copilot-review-gate:
    name: Copilot Review Gate
    runs-on: ubuntu-latest
    steps:
      - name: Check for Copilot review and unresolved threads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          REPO="${{ github.repository }}"
          OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"

          # Handle both pull_request and pull_request_review events
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
          elif [ -n "${{ github.event.review.pull_request.number }}" ]; then
            PR_NUMBER="${{ github.event.review.pull_request.number }}"
          else
            echo "Could not determine PR number from event"
            exit 0
          fi

          echo "Checking Copilot review on PR #$PR_NUMBER"

          # Check if Copilot has reviewed (COMMENTED or APPROVED, not DISMISSED)
          REVIEWS=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" 2>&1) || {
            echo "::error::Failed to fetch reviews: $REVIEWS"
            exit 1
          }

          COPILOT_REVIEW=$(echo "$REVIEWS" | jq -r '
            [.[] | select(
              .user.login == "copilot-pull-request-reviewer[bot]" and
              (.state == "COMMENTED" or .state == "APPROVED")
            )] | first | .state // empty
          ')

          if [ -z "$COPILOT_REVIEW" ]; then
            echo "::error::Copilot has not reviewed yet. Waiting for review (2-5 min). Workflow re-runs automatically when Copilot submits."
            exit 1
          fi

          echo "Copilot has reviewed (state: $COPILOT_REVIEW)"

          # Use GraphQL to count unresolved, non-outdated Copilot review threads
          QUERY='
          query($owner: String!, $repo: String!, $pr: Int!) {
            repository(owner: $owner, name: $repo) {
              pullRequest(number: $pr) {
                reviewThreads(first: 100) {
                  nodes {
                    isResolved
                    isOutdated
                    comments(first: 1) {
                      nodes {
                        author {
                          login
                        }
                      }
                    }
                  }
                }
              }
            }
          }'

          RESULT=$(gh api graphql -f query="$QUERY" \
            -F owner="$OWNER" \
            -F repo="$REPO_NAME" \
            -F pr="$PR_NUMBER" 2>&1) || {
            echo "::error::GraphQL query failed: $RESULT"
            exit 1
          }

          # Count unresolved, non-outdated Copilot threads
          UNRESOLVED=$(echo "$RESULT" | jq '
            [.data.repository.pullRequest.reviewThreads.nodes[] |
              select(
                .isResolved == false and
                .isOutdated == false and
                (.comments.nodes[0].author.login == "copilot-pull-request-reviewer[bot]")
              )
            ] | length
          ')

          echo "Unresolved Copilot threads (non-outdated): $UNRESOLVED"

          if [ "$UNRESOLVED" -gt 0 ]; then
            echo "::error::$UNRESOLVED unresolved Copilot review thread(s). Fix the code or resolve threads before merging."
            exit 1
          fi

          echo "All Copilot review threads resolved. Gate passed."
